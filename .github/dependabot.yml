version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    assignees: [hakula139]
    commit-message:
      prefix: chore
      include: scope
    groups:
      python:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    assignees: [hakula139]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
