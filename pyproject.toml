[project]
name = "lb-mapper"
version = "0.1.0"
description = "Automatically map unlinked ListenBrainz listens to MusicBrainz recordings"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1", "python-dotenv>=1.2.4"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lb_mapper"]

[dependency-groups]
dev = ["mypy>=2.4.1", "pytest>=9.2.0", "pytest-cov>=7.1.0"]

[tool.uv]
required-version = ">=0.13"
python-downloads = "never"
python-preference = "only-system"

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "S", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
lines-after-imports = 2
split-on-trailing-comma = true
combine-as-imports = true

[tool.coverage.run]
source = ["src"]

[tool.pytest]
minversion = "9.0"
addopts = ["--quiet", "--cov", "--cov-report=term", "--cov-report=xml"]
strict = true
testpaths = ["tests"]

[tool.mypy]
files = ["."]
exclude_gitignore = true
strict = true
