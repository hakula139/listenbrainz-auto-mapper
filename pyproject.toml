[project]
name = "lb-mapper"
version = "0.1.0"
description = "Automatically map unlinked ListenBrainz listens to MusicBrainz recordings"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1", "python-dotenv>=1.2.4"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lb_mapper"]

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1"]

[tool.uv]
required-version = ">=0.13"
python-downloads = "never"
python-preference = "only-system"

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "S", "SIM", "UP", "W"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
lines-after-imports = 2
split-on-trailing-comma = true
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
files = ["."]
exclude_gitignore = true
strict = true
